<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <link rel="stylesheet" href="/src/style.css"/>
    <title>Craft Agent</title>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <div class="topbar-left">
            <span class="wordmark">Craft Agent</span>
            <span class="topbar-sub" data-i18n="app.sub">Craft 套件的 MCP 中枢</span>
        </div>
        <div class="topbar-right">
            <span class="conn-count" id="conn-count">—</span>
            <button class="btn ghost" id="btn-updates" data-i18n="topbar.check">检查更新</button>
            <div class="seg" id="lang-switch" title="Language">
                <button class="seg-btn" data-lang="zh">中文</button>
                <button class="seg-btn" data-lang="en">EN</button>
            </div>
            <button class="btn ghost" id="btn-mcp" data-i18n="topbar.mcp">MCP 配置</button>
        </div>
    </header>

    <div class="body">
        <aside class="sidebar">
            <div class="sidebar-head">
                <span data-i18n="sidebar.apps">应用</span>
                <span class="sidebar-count" id="app-count"></span>
            </div>
            <div class="app-list" id="app-list"></div>
            <div class="sidebar-foot">
                <button class="link" id="btn-data-dir" data-i18n="sidebar.openData">打开数据目录</button>
            </div>
        </aside>

        <main class="main">
            <section class="empty" id="empty">
                <div class="empty-mark">
                    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="6" y="10" width="22" height="26" rx="3"/>
                        <rect x="20" y="16" width="22" height="22" rx="3" fill="var(--bg)"/>
                        <path d="M25 23h12M25 29h8"/>
                    </svg>
                </div>
                <h2 data-i18n="empty.title">选择一个应用看状态</h2>
                <p data-i18n="empty.body">左边列的是本机 Craft 套件。</p>
                <ol class="steps">
                    <li data-i18n-html="empty.step1"></li>
                    <li data-i18n-html="empty.step2"></li>
                    <li data-i18n-html="empty.step3"></li>
                </ol>
            </section>

            <section class="detail" id="detail" hidden>
                <header class="detail-head">
                    <div class="app-mark" id="detail-mark">D</div>
                    <div class="detail-title">
                        <div class="detail-name-row">
                            <h1 id="detail-name">—</h1>
                            <span class="pill" id="detail-pill">—</span>
                        </div>
                        <p class="detail-meta" id="detail-meta"></p>
                    </div>
                    <div class="detail-actions" id="detail-actions"></div>
                </header>

                <div class="stat-row" id="stat-row"></div>

                <div class="panels">
                    <section class="panel">
                        <div class="panel-head">
                            <h3 data-i18n="panel.document">文档状态</h3>
                            <button class="btn mini" id="btn-inspect" data-i18n="panel.refresh">刷新</button>
                        </div>
                        <div class="doc-body" id="doc-body">
                            <p class="hint" data-i18n="doc.disconnected">未连接。</p>
                        </div>
                    </section>

                    <section class="panel">
                        <div class="panel-head">
                            <h3 data-i18n="panel.sessions">AI 会话</h3>
                            <span class="panel-note" id="session-note"></span>
                        </div>
                        <ul class="sessions" id="sessions"></ul>
                    </section>

                    <section class="panel wide">
                        <div class="panel-head">
                            <h3 data-i18n="panel.journal">会话操作流</h3>
                            <div class="seg" id="journal-filter">
                                <button class="seg-btn is-on" data-filter="all" data-i18n="filter.all">全部</button>
                                <button class="seg-btn" data-filter="mcp" data-i18n="filter.mcp">AI</button>
                                <button class="seg-btn" data-filter="gui" data-i18n="filter.gui">本机</button>
                            </div>
                        </div>
                        <ul class="journal" id="journal"></ul>
                    </section>
                </div>
            </section>
        </main>
    </div>

    <footer class="statusbar">
        <button class="status-item link" id="status-dir">—</button>
        <span class="status-item" id="update-state"></span>
        <span class="status-item" id="status-version"></span>
    </footer>
</div>

<div class="modal-backdrop" id="modal" hidden>
    <div class="modal">
        <header class="modal-head">
            <h3 data-i18n="modal.title">接入第三方 AI 工具</h3>
            <button class="btn mini" id="btn-modal-close" data-i18n="modal.close">关闭</button>
        </header>
        <p class="modal-copy" data-i18n-html="modal.copy"></p>
        <pre class="code" id="mcp-code"></pre>
        <div class="modal-foot">
            <span class="hint" id="mcp-hint" data-i18n="modal.hint">保存后重启客户端生效。</span>
            <button class="btn primary" id="btn-copy" data-i18n="modal.copyBtn">复制配置</button>
        </div>
    </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
